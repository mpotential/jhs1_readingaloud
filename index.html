<div class="reading-app-container">
  <style>
    .reading-app-container * {
      box-sizing: border-box !important;
    }
    .reading-app-container {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
      color: #334155;
    }
    .reading-app-container h2 {
      text-align: center;
      color: #1e293b;
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* 選択ボックスのレイアウト修整 */
    .reading-app-container .control-panel {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      width: 100%;
    }
    .reading-app-container .control-panel > div {
      flex: 1;
      min-width: 0; /* はみ出し防止 */
    }
    @media (max-width: 520px) {
      .reading-app-container .control-panel {
        flex-direction: column;
        gap: 12px;
      }
    }

    .reading-app-container label {
      font-weight: bold;
      font-size: 0.85rem;
      color: #475569;
      display: block;
      margin-bottom: 6px;
    }
    .reading-app-container select {
      width: 100%;
      height: 42px;
      padding: 0 10px;
      font-size: 0.95rem;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background-color: #fff;
      display: block;
    }
    .reading-app-container .progress-bar {
      font-weight: bold;
      color: #3b82f6;
      font-size: 0.9rem;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .reading-app-container .text-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      padding: 20px;
      border-radius: 12px;
      font-size: 1.35rem;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.6;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: break-word;
    }
    .reading-app-container .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .reading-app-container .btn-sub {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .reading-app-container .btn-sub:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .reading-app-container .btn-main-container {
      text-align: center;
      margin: 20px 0;
    }
    .reading-app-container .btn-record {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
      transition: all 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .reading-app-container .btn-record:hover {
      background-color: #1d4ed8;
    }
    .reading-app-container .btn-record.recording {
      background-color: #ef4444;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .reading-app-container .result-box {
      background: #ffffff;
      border: 2px solid #10b981;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
    }
    .reading-app-container .score-badge {
      text-align: center;
      font-size: 2.2rem;
      font-weight: bold;
      color: #10b981;
      margin: 5px 0 10px 0;
    }
    .reading-app-container .advice-box {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 10px 14px;
      border-radius: 4px;
      color: #b45309;
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .reading-app-container .recognized-text {
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>

  <h2>🎤 中学1年 英語音読チャレンジ！</h2>

  <!-- Unit / Part 選択 -->
  <div class="control-panel">
    <div>
      <label for="unit-select">単元（Unit）:</label>
      <select id="unit-select" onchange="onUnitChange()"></select>
    </div>
    <div>
      <label for="part-select">パート（Part）:</label>
      <select id="part-select" onchange="onPartChange()"></select>
    </div>
  </div>

  <!-- 進捗 & ナビゲーション -->
  <div class="progress-bar">
    <span id="progress-text">文 1 / 3</span>
  </div>

  <!-- 一文表示カード -->
  <div class="text-card" id="target-sentence">---</div>

  <div class="nav-buttons">
    <button class="btn-sub" id="prev-btn" onclick="prevSentence()">◀ 前の文</button>
    <button class="btn-sub" id="next-btn" onclick="nextSentence()">次の文 ▶</button>
  </div>

  <!-- 録音ボタン -->
  <div class="btn-main-container">
    <button class="btn-record" id="record-btn" onclick="toggleRecording()">🎤 この文を音読する</button>
  </div>

  <!-- 結果表示 -->
  <div id="result-area" class="result-box" style="display: none;">
    <div id="score" class="score-badge">0点</div>
    <div id="advice" class="advice-box">---</div>
    <div class="recognized-text">
      <strong>聞き取れた英語:</strong> <span id="recognized-output"></span>
    </div>
  </div>

    let currentUnit = "";
    let currentPart = "";
    let currentIndex = 0;
    let isRecording = false;
    let recognition = null;

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      initApp();
    });

    function initApp() {
      const unitSelect = document.getElementById("unit-select");
      unitSelect.innerHTML = "";
      Object.keys(textbookData).forEach(unit => {
        const opt = document.createElement("option");
        opt.value = unit;
        opt.innerText = unit;
        unitSelect.appendChild(opt);
      });

      onUnitChange();
    }

    // 音声認識オブジェクトを安全に作成
    function createRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.lang = 'en-US';
      rec.interimResults = false;

      rec.onresult = (event) => {
        const spokeText = event.results[0][0].transcript;
        evaluateSpeech(spokeText);
      };
      rec.onerror = (e) => {
        console.error("Speech Rec Error:", e);
        alert("音声をうまく認識できませんでした。マイクの許可を確認し、もう一度試してください。");
        stopRecordingUI();
      };
      rec.onend = () => {
        stopRecordingUI();
      };

      return rec;
    }

    function onUnitChange() {
      const unitSelect = document.getElementById("unit-select");
      currentUnit = unitSelect.value;

      const partSelect = document.getElementById("part-select");
      partSelect.innerHTML = "";
      Object.keys(textbookData[currentUnit]).forEach(part => {
        const opt = document.createElement("option");
        opt.value = part;
        opt.innerText = part;
        partSelect.appendChild(opt);
      });

      onPartChange();
    }

    function onPartChange() {
      const partSelect = document.getElementById("part-select");
      currentPart = partSelect.value;
      currentIndex = 0;
      updateSentenceDisplay();
    }

    function updateSentenceDisplay() {
      const sentences = textbookData[currentUnit][currentPart];
      document.getElementById("target-sentence").innerText = sentences[currentIndex];
      document.getElementById("progress-text").innerText = `文 ${currentIndex + 1} / ${sentences.length}`;
      
      document.getElementById("prev-btn").disabled = (currentIndex === 0);
      document.getElementById("next-btn").disabled = (currentIndex === sentences.length - 1);

      document.getElementById("result-area").style.display = "none";
    }

    function nextSentence() {
      const sentences = textbookData[currentUnit][currentPart];
      if (currentIndex < sentences.length - 1) {
        currentIndex++;
        updateSentenceDisplay();
      }
    }

    function prevSentence() {
      if (currentIndex > 0) {
        currentIndex--;
        updateSentenceDisplay();
      }
    }

    function toggleRecording() {
      if (!recognition) {
        recognition = createRecognition();
      }

      if (!recognition) {
        alert("お使いの端末・ブラウザは音声認識に対応していません。iPhoneの場合はSafariアプリをご利用ください。（LINEやChromeなどの内蔵ブラウザでは動かない場合があります）");
        return;
      }

      if (!isRecording) {
        try {
          recognition.start();
          isRecording = true;
          const btn = document.getElementById("record-btn");
          btn.innerHTML = "&#x23f9; 録音中...（話し終わると自動判定）";
          btn.classList.add("recording");
        } catch (e) {
          console.error(e);
          alert("録音の開始に失敗しました。もう一度ボタンを押してください。");
          stopRecordingUI();
        }
      } else {
        recognition.stop();
        stopRecordingUI();
      }
    }

    function stopRecordingUI() {
      isRecording = false;
      const btn = document.getElementById("record-btn");
      btn.innerHTML = "&#x1f3a4; この文を音読する";
      btn.classList.remove("recording");
    }

    function cleanWords(text) {
      return text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(w => w.length > 0);
    }

    function evaluateSpeech(spokeText) {
      const targetText = textbookData[currentUnit][currentPart][currentIndex];
      const targetWords = cleanWords(targetText);
      const spokeWords = cleanWords(spokeText);

      let matchCount = 0;
      let missingWords = [];

      targetWords.forEach(word => {
        if (spokeWords.includes(word)) {
          matchCount++;
        } else {
          missingWords.push(word);
        }
      });

      const accuracy = targetWords.length > 0 ? Math.round((matchCount / targetWords.length) * 100) : 0;

      document.getElementById("score").innerText = accuracy + "点";
      document.getElementById("recognized-output").innerText = spokeText;

      let adviceText = "";
      if (accuracy === 100) {
        adviceText = "&#x1f389; パーフェクト！発音も単語もばっちりです！";
      } else if (accuracy >= 80) {
        adviceText = `&#x1f44d; おしい！とても上手に読めています。`;
        if (missingWords.length > 0) {
          adviceText += ` 「${missingWords.join(', ')}」の発音を意識してみよう！`;
        }
      } else if (accuracy >= 50) {
        adviceText = `&#x1f4aa; あと一歩！ゆっくりでもいいので単語を一つずつハッキリ声に出してみよう。`;
      } else {
        adviceText = `&#x1f60a; お手本の英文をしっかり見ながら、もう一度チャレンジしてみよう！`;
      }

      document.getElementById("advice").innerHTML = adviceText;
      document.getElementById("result-area").style.display = "block";
    }
  </script>
